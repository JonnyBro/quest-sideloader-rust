[package]
name = "quest-sideloader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37.0"
egui_extras = { version = "0.37.0", features = ["file", "image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
notify-rust = "4.19.0"
quest-sideloader-core = { path = "../core" }
rfd = "0.18.0"
rust-i18n = "4.2.4"
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

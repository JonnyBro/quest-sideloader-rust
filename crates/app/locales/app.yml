lib.install_no_stream_tip:
  en: "Copies the APK to the headset, then installs it. Slower, and the copy needs about as much free space as the APK. Try it if a normal install of a big APK breaks off."
  ru: "Копирует APK на шлем, потом устанавливает. Медленнее, и копии нужно столько же свободного места, сколько весит APK. Попробуйте, если обычная установка большого APK обрывается."

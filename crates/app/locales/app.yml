  ru: "Установка %{name} оборвалась"
  uk: "Встановлення %{name} обірвалося"
stream.text:
  en: "The connection to adb broke off while the APK was being sent. On some PCs this happens with big APKs, for example when another program closes adb or the USB connection drops. Installing without streaming copies the APK to the headset first and may get through."
  ru: "Соединение с adb оборвалось, пока передавался APK. На некоторых компьютерах так бывает с большими APK, например когда adb закрывает другая программа или пропадает USB-соединение. Установка без стриминга сначала копирует APK на шлем, так она может пройти."
  uk: "З'єднання з adb обірвалося, поки передавався APK. На деяких комп'ютерах так буває з великими APK, наприклад коли adb закриває інша програма або зникає USB-з'єднання. Встановлення без стрімінгу спершу копіює APK на шолом, так воно може пройти."
stream.space:
  en: "While it installs, the headset needs about as much extra free space as the APK takes."
  ru: "Пока идёт установка, на шлеме нужно примерно на размер APK больше свободного места."
  uk: "Поки триває встановлення, на шоломі потрібно приблизно на розмір APK більше вільного місця."

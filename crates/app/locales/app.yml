adb.title:
  en: "ADB not found"
  ru: "ADB не найден"
adb.text:
  en: "The app talks to the headset through adb from Android SDK Platform-Tools. It can download Platform-Tools from Google (dl.google.com) into its data folder and use them, or you can install them yourself and set the adb path in Settings."
  ru: "Приложение общается со шлемом через adb из Android SDK Platform-Tools. Оно может скачать Platform-Tools с сайта Google (dl.google.com) в свою папку данных и пользоваться ими. Или установите их сами и укажите путь к adb в Настройках."
adb.windows_driver:
  en: "Windows also needs Meta's ADB driver to see the headset over USB."
  ru: "Чтобы Windows видела шлем по USB, нужен ещё ADB-драйвер от Meta."
adb.driver_link:
  en: "Meta Quest ADB driver"
  ru: "ADB-драйвер Meta Quest"
adb.terms:
  en: "Downloading means you accept the "
  ru: "Скачивая, вы принимаете "
adb.terms_link:
  en: "Android SDK terms"
  ru: "условия Android SDK"
adb.no_build:
  en: "Google doesn't publish adb for this system, so it has to be installed by hand."
  ru: "Google не выпускает adb для этой системы, поэтому его придётся установить вручную."
adb.install:
  en: "Install automatically"
  ru: "Установить автоматически"

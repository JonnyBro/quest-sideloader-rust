hs.app_safety_off_text:
  en: "Turns off the App Safety checks, clears com.oculus.ocms data and restarts the headset's interface. A system update or a headset restart may turn the checks back on; if so, do this again."
  ru: "Отключает проверки App Safety, очищает данные com.oculus.ocms и перезапускает интерфейс шлема. После обновления системы или перезагрузки шлема проверки могут включиться снова, тогда отключите их ещё раз."
  uk: "Вимикає перевірки App Safety, очищає дані com.oculus.ocms і перезапускає інтерфейс шолома. Після оновлення системи або перезавантаження шолома перевірки можуть увімкнутися знову, тоді вимкніть їх ще раз."
hs.app_safety_on_text:
  en: "Turns the App Safety checks back on, clears com.oculus.ocms data and restarts the headset's interface. Sideloaded apps may be flagged or blocked again."
  ru: "Возвращает проверки App Safety, очищает данные com.oculus.ocms и перезапускает интерфейс шлема. Установленные вручную приложения снова могут помечаться или блокироваться."
  uk: "Повертає перевірки App Safety, очищає дані com.oculus.ocms і перезапускає інтерфейс шолома. Встановлені вручну застосунки знову можуть позначатися або блокуватися."

keys.intro:
  en: "Each renamed copy is signed with its own key. Android only installs an update over a copy signed with the same key, so back these files up: without its key, a copy can only be uninstalled and installed again. Apps with a key here are never offered for upload to the mirror."
  ru: "Каждая копия подписана своим ключом. Android ставит обновление поверх копии только с тем же ключом, поэтому сохраните эти файлы: без них копию можно только удалить и поставить заново. Приложения с ключом здесь никогда не предлагаются к загрузке на зеркало."
  uk: "Кожна копія підписана своїм ключем. Android ставить оновлення поверх копії лише з тим самим ключем, тому збережіть ці файли: без них копію можна тільки видалити й поставити заново. Застосунки з ключем тут ніколи не пропонуються для надсилання на дзеркало."

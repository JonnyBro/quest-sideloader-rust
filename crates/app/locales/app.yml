con.intro:
  en: "The catalog doesn't have these apps from %{device}, or has older versions. Sending them helps everyone who uses this mirror."
  ru: "Этих приложений с %{device} нет в каталоге, или там более старые версии. Отправка поможет всем, кто пользуется этим зеркалом."
  uk: "Цих застосунків з %{device} немає в каталозі, або там старіші версії. Надсилання допоможе всім, хто користується цим дзеркалом."
con.privacy:
  en: "An upload sends the app's APK and OBB files, the headset model, and an anonymous headset id (a SHA-256 hash of its serial number) to the mirror. Nothing is uploaded until you press Upload, and nothing on the headset changes."
  ru: "Отправляются APK и OBB-файлы приложения, модель шлема и анонимный идентификатор шлема (SHA-256 от серийного номера). Ничего не отправится, пока вы не нажмёте \"Отправить\", и на самом шлеме ничего не меняется."
  uk: "Надсилаються APK та OBB-файли застосунку, модель шолома й анонімний ідентифікатор шолома (SHA-256 від серійного номера). Нічого не надішлеться, доки ви не натиснете \"Надіслати\", і на самому шоломі нічого не змінюється."

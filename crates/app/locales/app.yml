  uk: "Не зараз"
rclone.title:
  en: "rclone not found"
  ru: "rclone не найден"
  uk: "rclone не знайдено"
rclone.text:
  en: "Mirrors are read through rclone. The app can download the official build from rclone.org into its data folder, check it against the published checksum and use it. You can also install rclone yourself and set its path in Settings."
  ru: "Зеркала читаются через rclone. Приложение может скачать официальную сборку с rclone.org в свою папку данных, сверить её с опубликованной контрольной суммой и пользоваться ею. Или установите rclone сами и укажите путь к нему в Настройках."
  uk: "Дзеркала читаються через rclone. Застосунок може завантажити офіційну збірку з rclone.org у свою теку даних, звірити її з опублікованою контрольною сумою й користуватися нею. Або встановіть rclone самі й вкажіть шлях до нього в Налаштуваннях."
rclone.no_build:
  en: "rclone.org has no build for this system, so rclone has to be installed by hand."
  ru: "На rclone.org нет сборки для этой системы, поэтому rclone придётся установить вручную."
  uk: "На rclone.org немає збірки для цієї системи, тому rclone доведеться встановити вручну."
welcome.title:
  en: "Welcome to Quest Sideloader"
  ru: "Добро пожаловать в Quest Sideloader"
  uk: "Ласкаво просимо до Quest Sideloader"
welcome.step:
  en: "Step %{n} of %{total}"
  ru: "Шаг %{n} из %{total}"
  uk: "Крок %{n} з %{total}"
welcome.intro:
  en: "A few settings to start with. All of them can be changed later in Settings."
  ru: "Несколько настроек для начала. Все их можно поменять потом в Настройках."
  uk: "Кілька налаштувань для початку. Усі їх можна змінити згодом у Налаштуваннях."
welcome.folder_text:
  en: "Games are downloaded and unpacked into this folder. Large games take tens of GB, so pick a drive with enough space."
  ru: "Игры скачиваются и распаковываются в эту папку. Большие игры занимают десятки ГБ, так что выберите диск, где хватит места."
  uk: "Ігри завантажуються й розпаковуються в цю теку. Великі ігри займають десятки ГБ, тож виберіть диск, де вистачить місця."
welcome.headset_text:
  en: "Turn on developer mode in the Meta Horizon app, then connect the headset with a USB cable and allow USB debugging when the headset asks. It then shows up on the Devices tab."
  ru: "Включите режим разработчика в приложении Meta Horizon, потом подключите шлем USB-кабелем и разрешите отладку по USB, когда шлем спросит. После этого он появится на вкладке Устройства."
  uk: "Увімкніть режим розробника в застосунку Meta Horizon, потім підключіть шолом USB-кабелем і дозвольте налагодження через USB, коли шолом запитає. Після цього він з'явиться на вкладці Пристрої."
welcome.mirror_text:
  en: "The catalog is optional. To download games from it, add a mirror in Settings."
  ru: "Каталог необязателен. Чтобы скачивать из него игры, добавьте зеркало в Настройках."
  uk: "Каталог необов'язковий. Щоб завантажувати з нього ігри, додайте дзеркало в Налаштуваннях."

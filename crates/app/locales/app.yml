  en: "ADB setup"
  ru: "установка ADB"
rclone.title:
  en: "rclone not found"
  ru: "rclone не найден"
rclone.text:
  en: "This mirror needs rclone. The app can download the official build from rclone.org into its data folder, check it against the published checksum and use it. You can also install rclone yourself and set its path in Settings."
  ru: "Этому зеркалу нужен rclone. Приложение может скачать официальную сборку с rclone.org в свою папку данных, сверить её с опубликованной контрольной суммой и пользоваться ею. Или установите rclone сами и укажите путь к нему в Настройках."
rclone.no_build:
  en: "rclone.org has no build for this system, so rclone has to be installed by hand."
  ru: "На rclone.org нет сборки для этой системы, поэтому rclone придётся установить вручную."
tasks.kind_rclone:
  en: "rclone setup"
  ru: "установка rclone"

  en: "The key file is deleted for good. Without it, an update can't be installed over the copy already on the headset: it will have to be uninstalled and installed again. Export the key first if you may need it."
  ru: "Файл ключа удалится насовсем. Без него обновление поверх копии, которая уже стоит на шлеме, не поставить: её придётся удалить и установить заново. Если ключ может понадобиться, сначала сделайте экспорт."
  uk: "Файл ключа буде видалено назавжди. Без нього оновлення поверх копії, яка вже стоїть на шоломі, не поставити: її доведеться видалити й установити заново. Якщо ключ може знадобитися, спершу зробіть експорт."

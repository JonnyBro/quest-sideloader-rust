  en: "This release comes with a script of adb commands. Some lines do more than install the game, so they won't run without your permission."
  ru: "В этом релизе есть скрипт с командами adb. Некоторые строки делают что-то помимо установки игры, поэтому без вашего разрешения они не выполнятся."

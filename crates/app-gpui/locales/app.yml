  ru: "Восстановить в другое приложение?"
hs.restore_into_text:
  en: "The saves of %{backup} from %{date} go into %{name} (%{package}). Its files with the same names are replaced. File names that contain the original package get the new one, so the app finds them. Games that encrypt saves with their package or signature may not read them."
  ru: "Сохранения %{backup} от %{date} будут записаны в %{name} (%{package}). Его файлы с теми же именами заменятся. В именах файлов с оригинальным пакетом он заменяется на новый, чтобы приложение их нашло. Игры, которые шифруют сохранения с привязкой к пакету или подписи, могут их не прочитать."

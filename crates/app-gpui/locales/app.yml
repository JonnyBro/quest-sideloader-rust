rev.heading:
  en: "Review install.txt: %{title}"
  ru: "Проверка install.txt: %{title}"
rev.intro:
  en: "This release comes with a script of adb commands. Some lines do more than install the game, so they won't run without your permission."
  ru: "В этом релизе есть скрипт с командами adb. Некоторые строки делают что-то помимо установки игры, поэтому без вашего разрешения они не выполнятся."
rev.package:
  en: "Game package:"
  ru: "Пакет игры:"
rev.counts:
  en: "%{suspicious} line(s) need permission, %{blocked} line(s) will never run."
  ru: "Требуют разрешения строк: %{suspicious}, никогда не выполнятся: %{blocked}."
rev.run_all:
  en: "Run all allowed lines"
  ru: "Выполнить все разрешённые строки"
rev.run_all_hint:
  en: "Runs safe and highlighted lines; blocked lines are still skipped"
  ru: "Выполняет безопасные и подсвеченные строки; заблокированные всё равно пропускаются"
rev.safe_only:
  en: "Run safe lines only"
  ru: "Только безопасные строки"
rev.safe_only_hint:
  en: "The game may not work if a skipped line was needed"
  ru: "Игра может не работать, если пропущенная строка была нужна"

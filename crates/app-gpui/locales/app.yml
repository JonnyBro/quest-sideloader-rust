  ru: "серые строки не являются командами adb и пропускаются"
adb.title:
  en: "ADB not found"
  ru: "ADB не найден"
adb.text:
  en: "The app talks to the headset through adb from Android SDK Platform-Tools. It can download Platform-Tools from Google (dl.google.com) into its data folder and use them, or you can install them yourself and set the adb path in Settings."
  ru: "Приложение общается со шлемом через adb из Android SDK Platform-Tools. Оно может скачать Platform-Tools с сайта Google (dl.google.com) в свою папку данных и пользоваться ими. Или установите их сами и укажите путь к adb в Настройках."
adb.windows_driver:
  en: "Windows also needs Meta's ADB driver to see the headset over USB."
  ru: "Чтобы Windows видела шлем по USB, нужен ещё ADB-драйвер от Meta."
adb.driver_link:
  en: "Meta Quest ADB driver"
  ru: "ADB-драйвер Meta Quest"
adb.terms:
  en: "Downloading means you accept the "
  ru: "Скачивая, вы принимаете "
adb.terms_link:
  en: "Android SDK terms"
  ru: "условия Android SDK"
adb.no_build:
  en: "Google doesn't publish adb for this system, so it has to be installed by hand."
  ru: "Google не выпускает adb для этой системы, поэтому его придётся установить вручную."
adb.install:
  en: "Install automatically"
  ru: "Установить автоматически"
adb.open_page:
  en: "Open download page"
  ru: "Открыть страницу загрузки"
adb.not_now:
  en: "Not now"
  ru: "Не сейчас"
rclone.title:
  en: "rclone not found"
  ru: "rclone не найден"
rclone.text:
  en: "Mirrors are read through rclone. The app can download the official build from rclone.org into its data folder, check it against the published checksum and use it. You can also install rclone yourself and set its path in Settings."
  ru: "Зеркала читаются через rclone. Приложение может скачать официальную сборку с rclone.org в свою папку данных, сверить её с опубликованной контрольной суммой и пользоваться ею. Или установите rclone сами и укажите путь к нему в Настройках."
rclone.no_build:
  en: "rclone.org has no build for this system, so rclone has to be installed by hand."
  ru: "На rclone.org нет сборки для этой системы, поэтому rclone придётся установить вручную."
welcome.title:
  en: "Welcome to Quest Sideloader"
  ru: "Добро пожаловать в Quest Sideloader"
welcome.step:
  en: "Step %{n} of %{total}"
  ru: "Шаг %{n} из %{total}"
welcome.intro:
  en: "A few settings to start with. All of them can be changed later in Settings."
  ru: "Несколько настроек для начала. Все их можно поменять потом в Настройках."
welcome.folder_text:
  en: "Games are downloaded and unpacked into this folder. Large games take tens of GB, so pick a drive with enough space."
  ru: "Игры скачиваются и распаковываются в эту папку. Большие игры занимают десятки ГБ, так что выберите диск, где хватит места."
welcome.headset_text:
  en: "Turn on developer mode in the Meta Horizon app, then connect the headset with a USB cable and allow USB debugging when the headset asks. It then shows up on the Devices tab."
  ru: "Включите режим разработчика в приложении Meta Horizon, потом подключите шлем USB-кабелем и разрешите отладку по USB, когда шлем спросит. После этого он появится на вкладке Устройства."
welcome.mirror_text:
  en: "The library is optional. To download games from it, add a mirror in Settings."
  ru: "Библиотека необязательна. Чтобы скачивать из неё игры, добавьте зеркало в Настройках."

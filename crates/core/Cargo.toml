[package]
name = "quest-sideloader-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
apk-info = "1.1.1"
base64 = "0.23.1"
directories = "6.0.0"
fs4 = "1.1.0"
md-5 = "0.11.0"
percent-encoding = "2.3.2"
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["aes256", "bzip2", "ppmd", "util"] }
shell-words = "1.1.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util", "process", "fs"] }
toml = "1.2.1"
tracing = "0.1.44"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
sevenz-rust2 = { version = "0.25.0", features = ["compress"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util", "macros", "rt-multi-thread"] }

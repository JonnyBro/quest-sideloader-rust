[package]
name = "quest-sideloader-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
apk-info = "1.1.1"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
shell-words = "1.1.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util", "process", "fs"] }
toml = "1.2.1"
tracing = "0.1.44"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

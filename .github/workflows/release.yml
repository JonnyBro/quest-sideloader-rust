name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the workspace version $version"
            exit 1
          fi

      - name: Check API key secret
        shell: bash
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::warning::The API_KEY secret isn't set; a release without it can't use the mirror"
          fi

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.targets }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libvulkan-dev

      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'

      - name: Install Metal toolchain
        if: runner.os == 'macOS'
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build
        shell: bash
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          for target in ${{ matrix.targets }}; do
            cargo build --release --locked --target "$target" -p quest-sideloader
          done

      - name: Package
        shell: bash
        run: |
          name="quest-sideloader-$GITHUB_REF_NAME-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cp LICENSE README.md "dist/$name/"
          case "${{ matrix.name }}" in
            windows-*)
              cp target/x86_64-pc-windows-msvc/release/quest-sideloader.exe "dist/$name/"
              cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null
              ;;
            linux-*)
              cp target/x86_64-unknown-linux-gnu/release/quest-sideloader "dist/$name/"
              cp crates/app/assets/app-icon/quest-sideloader.desktop \
                crates/app/assets/app-icon/quest-sideloader.png "dist/$name/"
              tar -C dist -czf "dist/$name.tar.gz" "$name"
              ;;
            macos-*)
              app="dist/$name/Quest Sideloader.app/Contents"
              mkdir -p "$app/MacOS" "$app/Resources"
              lipo -create -output "$app/MacOS/quest-sideloader" \
                target/aarch64-apple-darwin/release/quest-sideloader \
                target/x86_64-apple-darwin/release/quest-sideloader
              cp crates/app/assets/app-icon/quest-sideloader.icns "$app/Resources/"
              sed "s/@VERSION@/${GITHUB_REF_NAME#v}/g" crates/app/macos/Info.plist > "$app/Info.plist"
              # Ad-hoc signature: there is no Developer ID, but Apple Silicon
              # refuses to run a bundle whose signature doesn't match its contents.
              codesign --force --sign - "dist/$name/Quest Sideloader.app"
              (cd dist && ditto -c -k --keepParent "$name" "$name.zip")
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*

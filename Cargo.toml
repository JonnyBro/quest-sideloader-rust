[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "2.3.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
debug = false
